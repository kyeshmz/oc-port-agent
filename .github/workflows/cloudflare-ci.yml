name: Cloudflare app offline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/cloudflare
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: apps/cloudflare/package-lock.json

      - name: Install the pinned app toolchain
        run: npm ci

      - name: Generate Wrangler environment types
        run: npm run types

      - name: Type-check app
        run: npm run typecheck

      - name: Run offline app and Workerd tests
        run: npm test

      - name: Run the Workerd runtime smoke explicitly
        run: npm run test:runtime

      - name: Build Wrangler Worker-only dry-run bundle without Docker
        run: npm run build:worker
