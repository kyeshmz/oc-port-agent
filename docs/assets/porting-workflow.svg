<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title description">
  <title id="title">oc-port-agent: adopt behavior, keep your architecture</title>
  <desc id="description">Upstream changes flow through a tracking policy, OpenCode adaptation and host-run tests, then into a reviewable proposal in your repository. The hosted app can discover public upstream activity through Atom feeds without an upstream installation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101d31"/>
      <stop offset="1" stop-color="#080f1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#6ee7c4"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a9c1df" stroke-opacity=".045"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="m2 1 5 4-5 4" fill="none" stroke="#6ee7c4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="580" rx="24" fill="url(#background)"/>
  <rect width="1200" height="580" rx="24" fill="url(#grid)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(48 44)">
      <rect width="36" height="36" rx="10" fill="#6ee7c4" fill-opacity=".12"/>
      <path d="m9 18 6-6m-6 6 6 6m12-6-6-6m6 6-6 6" fill="none" stroke="#6ee7c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="49" y="26" fill="#e8f1ff" font-size="24" font-weight="700">oc-port-agent</text>
    </g>
    <rect x="898" y="47" width="254" height="30" rx="15" fill="#1a2a40"/>
    <text x="1025" y="67" text-anchor="middle" fill="#b6c7dc" font-size="12" font-weight="600" letter-spacing="2">PORT · VERIFY · REVIEW</text>
    <text x="48" y="150" fill="#f0f6ff" font-size="46" font-weight="750" letter-spacing="-1.2">Adopt the behavior.</text>
    <text x="48" y="205" fill="url(#accent)" font-size="46" font-weight="750" letter-spacing="-1.2">Keep your architecture.</text>
    <text x="50" y="247" fill="#a6bad3" font-size="18">Track selected functionality across languages, frameworks, and repositories.</text>

    <g transform="translate(48 292)">
      <rect width="250" height="174" rx="16" fill="#142337" stroke="#294159"/>
      <text x="20" y="32" fill="#6ee7c4" font-size="12" font-weight="700" letter-spacing="1.5">01 / UPSTREAM</text>
      <text x="20" y="69" fill="#f0f6ff" font-size="23" font-weight="650">Follow changes</text>
      <text x="20" y="102" fill="#b2c5dc" font-size="16">Selected code and tests</text>
      <text x="20" y="128" fill="#b2c5dc" font-size="16">Commits and tags</text>
      <text x="20" y="153" fill="#6ee7c4" font-size="13">Public feeds · optional webhooks</text>
    </g>
    <path d="M304 379h20" fill="none" stroke="#6ee7c4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(332 292)">
      <rect width="250" height="174" rx="16" fill="#142337" stroke="#294159"/>
      <text x="20" y="32" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="1.5">02 / YOUR POLICY</text>
      <text x="20" y="69" fill="#f0f6ff" font-size="23" font-weight="650">Define the scope</text>
      <text x="20" y="102" fill="#b2c5dc" font-size="16">What should stay aligned?</text>
      <text x="20" y="128" fill="#b2c5dc" font-size="16">What must stay different?</text>
      <text x="20" y="153" fill="#93c5fd" font-size="13">Paths · acceptance · preservation</text>
    </g>
    <path d="M588 379h20" fill="none" stroke="#6ee7c4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(616 292)">
      <rect width="250" height="174" rx="16" fill="#142337" stroke="#294159"/>
      <text x="20" y="32" fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="1.5">03 / OPENCODE + HOST</text>
      <text x="20" y="69" fill="#f0f6ff" font-size="23" font-weight="650">Adapt and verify</text>
      <text x="20" y="102" fill="#b2c5dc" font-size="16">Fit your existing design</text>
      <text x="20" y="128" fill="#b2c5dc" font-size="16">Run your configured tests</text>
      <text x="20" y="153" fill="#c4b5fd" font-size="13">Scoped edits · recorded evidence</text>
    </g>
    <path d="M872 379h20" fill="none" stroke="#6ee7c4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(900 292)">
      <rect width="250" height="174" rx="16" fill="#142d32" stroke="#39665d"/>
      <text x="20" y="32" fill="#6ee7c4" font-size="12" font-weight="700" letter-spacing="1.5">04 / YOUR REPOSITORY</text>
      <text x="20" y="69" fill="#f0f6ff" font-size="23" font-weight="650">Review the port</text>
      <text x="20" y="102" fill="#b2c5dc" font-size="16">A local branch or draft PR</text>
      <text x="20" y="128" fill="#b2c5dc" font-size="16">A traceable upstream range</text>
      <text x="20" y="153" fill="#6ee7c4" font-size="13">Merge activates the checkpoint</text>
    </g>

    <path d="M48 505h1104" stroke="#26384e"/>
    <circle cx="55" cy="540" r="5" fill="#6ee7c4"/>
    <text x="72" y="546" fill="#d3e2f4" font-size="16">Your policy is the boundary. Your tests are the check.</text>
    <text x="1152" y="546" text-anchor="end" fill="#91a8c3" font-size="14">Built with OpenCode V2</text>
  </g>
</svg>
